<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; }
  h1, h2 { color: #333; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 24px; }
  th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
  th { background: #f5f5f5; font-weight: 600; }
  tr.red td { background: #fbe6e6; }
  tr.green td { background: #e6f7e6; }
  tr.yellow td { background: #fff8e6; }
  .count { font-weight: 600; font-size: 14px; }
  .copy-link { font-family: monospace; font-size: 11px; color: #555; word-break: break-all; }
  .controls { margin-bottom: 16px; }
  button.refresh { padding: 8px 14px; background: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .summary-card { padding: 16px; border-radius: 8px; border: 1px solid #ddd; }
  .summary-card h3 { margin: 0 0 8px 0; font-size: 14px; }
  .big { font-size: 28px; font-weight: 700; }
  .label { color: #888; font-size: 12px; }
</style>
</head>
<body>

<h1>📊 EQ Presidency Scheduler — <?= getCurrentQuarter() ?> Dashboard</h1>

<div class="controls">
  <button class="refresh" onclick="google.script.run.withSuccessHandler(reload_).showDashboardSidebar()">↻ Refresh</button>
  <span style="margin-left: 12px; color: #888; font-size: 12px;">
    Refresh from spreadsheet (note: clicking this reloads the modal).
  </span>
</div>

<h2>Per-District Summary</h2>
<div class="summary" id="summary">
  <!-- populated by serverSummary -->
</div>

<h2>Companionships not yet booked</h2>
<table id="pendingTable">
  <thead>
    <tr>
      <th>Companionship</th>
      <th>Assigned Leader</th>
      <th>Status</th>
      <th>Booking Link</th>
    </tr>
  </thead>
  <tbody id="pendingTbody">
    <!-- server-rendered rows below -->
  </tbody>
</table>

<h2>All Companionships</h2>
<table id="allTable">
  <thead>
    <tr>
      <th>Companionship</th>
      <th>Assigned Leader</th>
      <th>Status</th>
      <th>Booked At</th>
    </tr>
  </thead>
  <tbody id="allTbody">
    <!-- server-rendered rows below -->
  </tbody>
</table>

<script>
  // Status badges
  function statusBadge(s) {
    const map = {
      'Pending':   '<span style="color: #c00;">● Pending</span>',
      'Booked':    '<span style="color: #060;">● Booked</span>',
      'Completed': '<span style="color: #888;">● Completed</span>',
    };
    return map[s] || (s || '—');
  }

  // Get data injected server-side via DOM
  const PENDING_HTML = document.getElementById('pendingRows') ? document.getElementById('pendingRows').innerHTML : '';
  const ALL_HTML     = document.getElementById('allRows')     ? document.getElementById('allRows').innerHTML     : '';
  const SUMMARY_HTML = document.getElementById('summaryData')  ? document.getElementById('summaryData').innerHTML : '';

  document.getElementById('pendingTbody').innerHTML = PENDING_HTML;
  document.getElementById('allTbody').innerHTML     = ALL_HTML;
  document.getElementById('summary').innerHTML      = SUMMARY_HTML;
</script>

<!-- Hidden server-rendered data fragments -->
<div id="summaryData" style="display:none;">
  <? renderSummary_(); ?>
</div>
<div id="pendingRows" style="display:none;">
  <? renderPendingRows_(); ?>
</div>
<div id="allRows" style="display:none;">
  <? renderAllRows_(); ?>
</div>

</body>
</html>
