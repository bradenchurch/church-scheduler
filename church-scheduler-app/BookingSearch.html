<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; max-width: 600px; margin: 0 auto; }
  h1 { font-size: 18px; }
  .meta { background: #f5f5f5; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  .search-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  input[type="text"] { padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  .hint { color: #888; font-size: 12px; }
  .results { display: flex; flex-direction: column; gap: 8px; }
  .hit { display: block; width: 100%; padding: 14px 16px; border: 1px solid #ddd;
         border-radius: 8px; background: white; cursor: pointer; text-align: left;
         font-size: 14px; transition: background 0.15s; }
  .hit:hover { background: #f0f7ff; border-color: #4a90e2; }
  .hit.disabled { background: #f5f5f5; color: #888; cursor: not-allowed; }
  .empty { padding: 24px; text-align: center; color: #888; }
  .error { background: #fbe6e6; padding: 12px; border-radius: 8px; color: #c00; }
</style>
</head>
<body>
<h1>📅 EQ Presidency Interview — Book a Time</h1>

<div class="meta">
  <div>Quarter <?= quarter ?> &middot; Elders Quorum Presidency Interviews</div>
  <div class="hint">Type your last name below to find your companionship.</div>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Last name (e.g. Chollet)" autocomplete="off" />
</div>

<div id="results" class="results">
  <div class="empty">Start typing to search.</div>
</div>

<script>
  let timer = null;

  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(timer);
    const term = e.target.value;
    timer = setTimeout(() => doSearch(term), 200);
  });

  function doSearch(term) {
    if (!term || term.trim().length < 2) {
      document.getElementById('results').innerHTML = '<div class="empty">Type at least 2 characters.</div>';
      return;
    }
    google.script.run
      .withSuccessHandler(showResults)
      .withFailureHandler(showError)
      .searchCompanionships_(term);
  }

  function showResults(hits) {
    if (hits.length === 0) {
      document.getElementById('results').innerHTML =
        '<div class="empty">No match in your district. Check spelling, or try your companion\'s last name.</div>';
      return;
    }
    const html = hits.map(h => {
      const cls = h.Status === 'Booked' ? 'hit disabled' : 'hit';
      const label = h.Status === 'Booked' ? '(already booked) ' : '';
      return `<button class="${cls}" onclick="pick('${h.CompanionshipId}', ${h.Status === 'Booked'})">
                ${label}${h.DisplayName}
              </button>`;
    }).join('');
    document.getElementById('results').innerHTML = html;
  }

  function showError(err) {
    document.getElementById('results').innerHTML =
      '<div class="error">' + (err.message || err.toString()) + '</div>';
  }

  function pick(cid, alreadyBooked) {
    if (alreadyBooked) return;
    // Navigate to slot picker
    window.location.href = window.location.pathname + '?action=book&c=' + encodeURIComponent(cid);
  }
</script>
</body>
</html>
